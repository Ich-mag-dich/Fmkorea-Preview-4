# main에 push하거나 main으로 PR을 올리면 타입 검사, lint, 테스트, 빌드를 돌림.
# 릴리즈할 때가 아니라 올린 직후(PR은 합치기 전)에 깨진 걸 알 수 있게
name: CI

on:
  push:
    branches: [main]
  # 포크에서 온 PR도 읽기 권한 토큰만 받고 Secrets는 못 씀 (이 워크플로는 Secrets를 안 씀)
  pull_request:
    branches: [main]

permissions:
  contents: read

# 연달아 push하면 이전 실행은 취소하고 마지막 커밋만 확인
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run compile

      # 층별 책임, 캐시 키, HTML 렌더링 등 프로젝트 규칙 (eslint.config.js)
      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
