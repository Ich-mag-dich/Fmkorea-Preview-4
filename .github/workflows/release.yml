# 수동으로 실행해서 Chrome/Firefox용 zip을 빌드하고 GitHub 릴리즈에 올림.
# release면 Firefox Add-ons와 Chrome 웹 스토어에도 제출함
# 태그는 package.json의 version으로 정해짐 (예: 4.0.1 → v4.0.1)
name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: "릴리즈 종류 (release만 스토어에 제출. draft는 태그 없이 초안만 만들고, 공개할 때 태그가 생김)"
        type: choice
        options:
          - release
          - prerelease
          - draft
        default: release
      stores:
        description: "제출할 스토어 (Chrome은 이전 버전이 심사 중이면 firefox만 선택)"
        type: choice
        options:
          - all
          - firefox
          - chrome
        default: all
      dry_run:
        description: "스토어 키만 확인 (GitHub 릴리즈와 스토어 제출은 하지 않음)"
        type: boolean
        default: false

permissions:
  contents: write # 태그와 릴리즈 생성

# 실수로 두 번 눌러도 같은 버전 릴리즈가 동시에 만들어지지 않게
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 이전 태그를 찾아 그 뒤 커밋으로 릴리즈 노트를 만들려면 전체 이력이 필요

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run compile

      # 사이트 HTML 파서가 깨진 채로 릴리즈되지 않게
      - name: Test
        run: bun run test

      - name: Read version
        id: version
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check tag is new
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG 태그가 이미 있습니다. package.json의 version을 올린 뒤 다시 실행해 주세요."
            exit 1
          fi

      - name: Build zips
        id: zips
        run: |
          bun run zip
          bun run zip:firefox

      - name: Write release notes
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash .github/scripts/release-notes.sh "$TAG" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        id: release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TYPE: ${{ inputs.type }}
        # 스토어 제출용 소스 zip(-sources.zip)은 올리지 않음
        run: |
          flags=()
          case "$TYPE" in
            prerelease) flags+=(--prerelease) ;;
            draft) flags+=(--draft) ;;
          esac
          gh release create "$TAG" \
            .output/*-chrome.zip \
            .output/*-firefox.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${flags[@]}"

      # 스토어 제출 (wxt submit = publish-browser-extension). dry_run이면 키 확인용
      # 읽기 요청만 보내고 업로드·제출은 하지 않음
      - name: Submit to Firefox Add-ons
        if: >-
          ${{ inputs.stores != 'chrome'
          && (inputs.dry_run || inputs.type == 'release') }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FIREFOX_EXTENSION_ID: fmkorea-preview@extension
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        # AMO는 번들된 코드를 심사하려고 소스 zip도 받음
        run: |
          bunx wxt submit \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip

      # 이전 버전이 심사 중이면 이 단계는 실패함. 그럴 땐 stores를 firefox로 실행하고,
      # 심사가 끝난 뒤 Submit Chrome 워크플로로 이 릴리즈의 zip을 제출.
      # Firefox 제출이 실패해도 Chrome은 따로 시도
      - name: Submit to Chrome Web Store
        if: >-
          ${{ !cancelled() && inputs.stores != 'firefox'
          && steps.zips.outcome == 'success'
          && (inputs.dry_run || (inputs.type == 'release' && steps.release.outcome == 'success')) }}
        uses: ./.github/actions/submit-chrome
        with:
          zip: .output/*-chrome.zip
          dry-run: ${{ inputs.dry_run }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          service-account-client-email: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          service-account-private-key: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
